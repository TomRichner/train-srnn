name: seeg
data_dir: train_srnn/data/seeg

# File selector — override on CLI to switch condition/block/subject
subject_id: "939"
block: 4
sleep: awake         # awake | asleep
cond: baseline       # baseline | stim

# Preprocessing
decimate: 2          # 500 Hz -> 250 Hz via pair-average
seq_len: 3750        # 15 s @ 250 Hz (must equal window_len when no_augment=true)
stride: 1250         # 5 s stride — 67% overlap between consecutive 15 s windows

# ODE step sizing — model YAMLs interpolate these via ${task.h} / ${task.ode_unfolds}.
# h = 1/250 = 0.004 s makes taus in real seconds at the 250 Hz post-decimate rate.
h: 0.004
ode_unfolds: 1

# SRNN IO — must match detected channel count (asserted in train.py).
# Subject 939 has 89 channels; override for other subjects.
input_size: 89
output_size: 89
task_type: regression
per_timestep_labels: true
batch_size: 24

# Sequence + BPTT — top-level config picks these up via oc.select.
# 15 s window @ 250 Hz = 3750; 10 s grad horizon = 2500; 1 s chunk = 250.
# Forward-only warmup = window_len - bptt_len = 1250 (5 s).
# loss_over_bptt averages MSE across every grad-region step (autoregressive).
# stretch + palindrome augmentation off: seeg is real biological time.
window_len: 3750
bptt_len: 2500
bptt_chunk_len: 250
loss_over_bptt: true
stretch_lo: 1.0
stretch_hi: 1.0
no_augment: true
