defaults:
  - model: srnn
  - task: har
  - _self_

seed: 1
epochs: 200
batch_size: 128
lr: 5e-4
grad_clip: 1.0  # gradient norm clip; 0 or null disables
size: 32  # model hidden size

# Sequence augmentation
stretch_lo: 0.8
stretch_hi: 1.2
window_len: 1024    # fixed seq_len fed to model (samples) — stable for torch.compile
bptt_len: 512       # BPTT horizon in samples; grads flow through last bptt_len steps
burn_in: 10.0
burn_in_every: 1              # re-run burn-in every N epochs to track moving fixed point; 0 = only at init
freeze_ic_after_burnin: true  # freeze TrainableIC.ic after burn-in (matches truncated-BPTT reality where IC gets no grad; see KnownIssues §4)
no_augment: false   # when true, bypass stretch+palindrome (requires task.seq_len == window_len)

# Training
log_interval: 1  # log every N epochs
checkpoint_interval: 10
device: auto  # auto, cpu, cuda, mps
compile: true  # use torch.compile

# Ablation batching
batched_ablations: null  # list of model variant names to run in parallel via bmm

# Cloud/output
output_dir: results/${task.name}/${model.name}_${size}
