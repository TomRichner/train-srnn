# The schema and every default live in train_srnn/config.py. Pick a task and a
# model here; override any field on the command line, e.g.
#   python train.py task=cheetah100 model=srnn model.variants=[srnn,srnn-no-adapt] epochs=100
defaults:
  - base_config
  - model: srnn
  - task: cheetah100
  - _self_

hydra:
  run:
    dir: ${output_dir}
  output_subdir: .hydra
  job:
    chdir: false
