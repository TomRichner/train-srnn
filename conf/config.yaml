defaults:
  - model: srnn
  - task: har
  - _self_

seed: 1
epochs: 200
early_exit_after_init: false  # write init.pt + last.pt then exit before training (for fresh-IC postprocess analysis)
batch_size: 128
lr: 3e-4
cosine_decay: false  # if true, cosine-decay LR after hold phase to lr/20
grad_clip: 1.0  # gradient norm clip; 0 or null disables
size: 32  # model hidden size

# Sequence augmentation
stretch_lo: 0.8
stretch_hi: 1.2
window_len: 1024    # fixed seq_len fed to model (samples) — stable for torch.compile
bptt_len: 512       # BPTT horizon in samples; grads flow through last bptt_len steps
bptt_chunk_len: null  # TBPTT chunk: state.detach() every N steps in grad region; null = single graph
loss_over_bptt: false # when true + no_augment, compute loss at every step in grad region (teacher-forced)
grad_checkpoint: false              # wrap grad-region segments in torch.utils.checkpoint for ~5-10x activation memory savings (~30-50% wall-clock cost)
grad_checkpoint_segment_len: null   # checkpoint segment length within grad region; null defaults to bptt_chunk_len
burn_in: 10.0
burn_in_every: 1              # re-run burn-in every N epochs to track moving fixed point; 0 = only at init
freeze_ic_after_burnin: true  # freeze TrainableIC.ic after burn-in (matches truncated-BPTT reality where IC gets no grad; see KnownIssues §4)
no_augment: false   # when true, bypass stretch+palindrome (requires task.seq_len == window_len)

# Training
log_interval: 1  # log every N epochs
checkpoint_interval: 10
device: auto  # auto, cpu, cuda, mps
compile: true  # use torch.compile
amp: fp32      # fp32 | bf16. bf16 requires Ampere+ GPU (L4, A100, H100, RTX 30/40).

# Ablation batching
batched_ablations: null  # list of model variant names to run in parallel via bmm

# Closed-loop variable teacher forcing.
# When enabled, training batches are unrolled with a per-channel blend of
# real input and the model's previous prediction:
#     x_in[t,c] = (1 - alpha[t,c]) * x_real[t,c] + alpha[t,c] * y_pred[t-1,c]
# alpha is sampled per batch from envelope(t) * clip(baseline + sparse-rnd[c]).
# Disabled by default — zero behavior change vs. pure teacher forcing.
# Requires input_size == output_size on the task. Eval is unaffected.
closed_loop:
  enabled: false
  # Fraction of batches with full teacher forcing (alpha=0 everywhere).
  teacher_forcing_batch_frac: 0.2
  # Per-batch baseline alpha (target value when ramping; constant otherwise).
  alpha_baseline: 0.3
  # If set (not null), ramp alpha_baseline linearly from this start value at
  # epoch 0 to `alpha_baseline` at the last epoch. null = constant baseline.
  alpha_baseline_start: null
  # Half-range of uniform jitter on baseline; 0 = fixed baseline.
  alpha_baseline_jitter: 0.0
  # Per-channel sparse Gaussian perturbation around baseline (mu fixed at 0).
  alpha_rnd_density: 0.0    # bernoulli prob per channel
  alpha_rnd_sigma: 0.0      # gaussian std
  # Half-cosine warmup ramp length in samples; 0 disables ramp (envelope=1).
  # Match this to your eval warmup length so train/eval regimes align.
  t_warm: 0

# Resume from a previous checkpoint (model + optimizer + scheduler).
# Local path or gs:// URL. Loaded after optimizer/scheduler are built and
# before the epoch loop; the new run still iterates `epochs` fresh epochs
# (its own CSVs/checkpoints in the new output_dir). Set to null to disable.
init_ckpt: null

# Cloud/output
output_dir: results/${task.name}/${model.name}_${size}
