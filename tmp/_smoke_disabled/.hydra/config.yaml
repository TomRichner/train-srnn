model:
  name: srnn
  type: srnn
  num_units: ${size}
  dales: true
  n_a_E: 3
  n_a_I: 3
  n_b_E: 1
  n_b_I: 1
  per_neuron: false
  echo: false
  skip: false
  solver: semi_implicit
  h: 0.02
  ode_unfolds: 4
  readout: synaptic
  tau_global_init: 1.0
  sparsity: 0.5
task:
  name: seeg
  data_dir: train_srnn/data/seeg
  subject_id: '939'
  block: 4
  sleep: awake
  cond: baseline
  decimate: 2
  seq_len: 512
  stride: 512
  input_size: 89
  output_size: 89
  task_type: regression
  per_timestep_labels: true
  batch_size: 16
seed: 1
epochs: 1
batch_size: 4
lr: 0.0003
cosine_decay: false
grad_clip: 1.0
size: 16
stretch_lo: 0.8
stretch_hi: 1.2
window_len: 128
bptt_len: 64
bptt_chunk_len: null
loss_over_bptt: false
grad_checkpoint: false
grad_checkpoint_segment_len: null
burn_in: 0
burn_in_every: 0
freeze_ic_after_burnin: true
no_augment: false
log_interval: 1
checkpoint_interval: 10
device: auto
compile: false
amp: 'off'
batched_ablations:
- srnn-no-adapt
closed_loop:
  enabled: false
  teacher_forcing_batch_frac: 0.2
  alpha_baseline: 0.3
  alpha_baseline_jitter: 0.0
  alpha_rnd_density: 0.0
  alpha_rnd_sigma: 0.0
  t_warm: 0
init_ckpt: null
output_dir: results/${task.name}/${model.name}_${size}
